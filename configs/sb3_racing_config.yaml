world:
  # Можно задавать до 50 x 50 x 50.
  size: [11.0, 3.0, 6.3]
  scenario: city
  density: 0.12
  seed: 42

  start: [1.5, 1.5, 3.0]
  goal: [9.0, 1.5, 4.5]

  # Для старого PPO сначала лучше оставить динамику выключенной.
  enable_dynamic_objects: true
  num_cars: 0
  num_pedestrians: 0

env:
  episode_length: 13.0
  pyb_freq: 240
  ctrl_freq: 30

  # false = та же сцена после reset; true = новая сцена с новым seed.
  regenerate_world_on_reset: false

training:
  total_timesteps: 5500000
  n_steps: 1560
  batch_size: 195
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  n_epochs: 80
  ent_coef: 0.01
  vf_coef: 1.0
  max_grad_norm: 0.5

  normalize_env: true

  checkpoint_freq: 50000
  checkpoint_dir: checkpoints
  log_dir: logs

  action_std_init: 0.6
  action_std_decay_rate: 0.05
  min_action_std: 0.1
  action_std_decay_freq: 250000
